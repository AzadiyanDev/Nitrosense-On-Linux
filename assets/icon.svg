<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222328"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="nitroRed" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="50%" stop-color="#d61f26"/>
      <stop offset="100%" stop-color="#990b10"/>
    </linearGradient>
    <linearGradient id="fanGrad" x1="60" y1="60" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4455"/>
      <stop offset="100%" stop-color="#b8141a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)" stroke="#38393e" stroke-width="2"/>
  <rect x="18" y="18" width="220" height="220" rx="46" fill="none" stroke="url(#nitroRed)" stroke-width="2" opacity="0.6"/>

  <!-- Nitro Stylized "N" & Fan Fusion -->
  <g filter="url(#glow)">
    <!-- Central Fan Ring -->
    <circle cx="128" cy="128" r="76" stroke="url(#nitroRed)" stroke-width="6" opacity="0.3"/>
    <circle cx="128" cy="128" r="54" stroke="#ff3344" stroke-width="3" stroke-dasharray="14 10" opacity="0.7"/>

    <!-- Dynamic Fan Blades -->
    <g transform="translate(128, 128)">
      <!-- Blade 1 -->
      <path d="M 0,-18 C 22,-24 45,-55 35,-70 C 25,-85 -2,-65 -8,-32 Z" fill="url(#fanGrad)"/>
      <!-- Blade 2 -->
      <g transform="rotate(72)">
        <path d="M 0,-18 C 22,-24 45,-55 35,-70 C 25,-85 -2,-65 -8,-32 Z" fill="url(#fanGrad)"/>
      </g>
      <!-- Blade 3 -->
      <g transform="rotate(144)">
        <path d="M 0,-18 C 22,-24 45,-55 35,-70 C 25,-85 -2,-65 -8,-32 Z" fill="url(#fanGrad)"/>
      </g>
      <!-- Blade 4 -->
      <g transform="rotate(216)">
        <path d="M 0,-18 C 22,-24 45,-55 35,-70 C 25,-85 -2,-65 -8,-32 Z" fill="url(#fanGrad)"/>
      </g>
      <!-- Blade 5 -->
      <g transform="rotate(288)">
        <path d="M 0,-18 C 22,-24 45,-55 35,-70 C 25,-85 -2,-65 -8,-32 Z" fill="url(#fanGrad)"/>
      </g>

      <!-- Center Hub with Nitro N -->
      <circle cx="0" cy="0" r="26" fill="#18191c" stroke="#ff3344" stroke-width="3"/>
      <!-- N glyph -->
      <path d="M -10,12 L -10,-12 L -5,-12 L 5,6 L 5,-12 L 10,-12 L 10,12 L 5,12 L -5,-6 L -5,12 Z" fill="#ff3344"/>
    </g>
  </g>

  <!-- Speed / Performance Accent Lines -->
  <path d="M 40,204 L 70,204" stroke="#ff3344" stroke-width="4" stroke-linecap="round"/>
  <path d="M 76,204 L 92,204" stroke="#ff3344" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 98,204 L 104,204" stroke="#ff3344" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>
